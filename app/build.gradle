plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace "com.emg.classifier"
    compileSdk 34

    defaultConfig {
        applicationId "com.emg.classifier"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    aaptOptions {
        noCompress "tflite"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    implementation 'androidx.core:core-ktx:1.12.0'
}